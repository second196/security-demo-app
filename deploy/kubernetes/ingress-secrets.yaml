# ============================================================
# 安全的 Ingress Secrets 配置
# ============================================================

# 使用 External Secrets Operator 或 Sealed Secrets 管理敏感信息
# 此文件仅作为参考模板

# ============================================================
# Secret 配置 - 应使用加密存储
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: security-demo-app
type: Opaque
# 注意: base64 不是加密，仅是编码
# 生产环境应使用:
# 1. Sealed Secrets (Bitnami)
# 2. External Secrets Operator
# 3. AWS Secrets Manager
# 4. HashiCorp Vault
# 5. Azure Key Vault
data:
  # 这些值应通过安全方式注入，不应在此文件中明文存储
  # 以下为示例占位符
  database-password: <base64-encoded-password>
  api-key: <base64-encoded-api-key>
  jwt-secret: <base64-encoded-jwt-secret>

---
# ============================================================
# 使用 External Secrets Operator 的示例
# ============================================================
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: app-external-secrets
#   namespace: security-demo-app
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#   target:
#     name: app-secrets
#   data:
#   - secretKey: database-password
#     remoteRef:
#       key: prod/security-demo-app/database-password
#   - secretKey: api-key
#     remoteRef:
#       key: prod/security-demo-app/api-key
#   - secretKey: jwt-secret
#     remoteRef:
#       key: prod/security-demo-app/jwt-secret

---
# ============================================================
# RBAC - 最小权限原则
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: security-demo-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]  # 仅允许读取特定 Secret

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: security-demo-app
subjects:
- kind: ServiceAccount
  name: app-service-account
  namespace: security-demo-app
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
