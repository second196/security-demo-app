# ============================================================
# Kubernetes Ingress with TLS 配置问题
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    # 1. 使用旧版 Ingress 注解
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # 2. 禁用 HTTPS 重定向
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # 3. 无速率限制注解
    # 4. 无 CORS 配置
    # 5. 无认证注解
spec:
  # 6. 无 IngressClass 指定
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-service
            port:
              number: 80
  # 7. TLS 配置缺失或不安全
  # tls:
  # - hosts:
  #   - app.example.com
  #   secretName: app-tls
  # 8. 无默认后端
---
# ============================================================
# Kubernetes Secret - 明文存储
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # 9. base64 不是加密，只是编码
  # 任何人 kubectl get secret 都能看到
  database-password: UEBzc3cwcmQxMjMh  # Password123!
  api-key: c2tfbGl2ZV80ZUMzOUhxTHlqV0Rhcmp0VDF6ZHA3ZGM=  # sk_live_4eC39HqLyjWDarjtT1zdp7dc
  jwt-secret: c3VwZXJfc2VjcmV0X2p3dF9rZXlfMTIzNDU=  # super_secret_jwt_key_12345
  # 10. 应该使用 External Secrets Operator 或 Sealed Secrets
---
# ============================================================
# Kubernetes ServiceAccount - 过度权限
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  # 11. 无注解限制
  # 应该添加:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/ROLE
  #   automation.conformity.com/enabled: "true"
---
# ============================================================
# Kubernetes Pod Disruption Budget - 缺失
# ============================================================
# 应该添加 PDB:
# apiVersion: policy/v1
# kind: PodDisruptionBudget
# metadata:
