# ============================================================
# 安全的 CloudFormation Template
# ============================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Security Demo Application Stack - Secured'

Parameters:
  DatabasePassword:
    Type: String
    NoEcho: true  # 隐藏参数值
    MinLength: 12
    Description: Database password (minimum 12 characters)
    AllowedPattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{12,}$'
    ConstraintDescription: Must contain at least 12 characters with uppercase, lowercase, number, and special character

  Environment:
    Type: String
    Default: 'staging'
    AllowedValues:
      - dev
      - staging
      - production

Resources:
  # ============================================================
  # 安全的 S3 Bucket
  # ============================================================
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-app-bucket-${AWS::AccountId}'
      # 启用版本控制
      VersioningConfiguration:
        Status: Enabled
      # 启用服务端加密
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref BucketEncryptionKey
      # 启用访问日志
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: 's3-access-logs/'
      # 禁用公共访问
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # 安全的 Security Group
  # ============================================================
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Web server security group'
      SecurityGroupIngress:
        # 仅允许 HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS access'
        # 仅允许 HTTP（用于重定向）
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP redirect to HTTPS'

  # ============================================================
  # 安全的 RDS 数据库
  # ============================================================
  AppDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${Environment}-app-db'
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: db.t3.micro
      MasterUsername: admin
      MasterUserPassword: !Ref DatabasePassword
      # 不公开访问
      PubliclyAccessible: false
      # 启用加密
      StorageEncrypted: true
      # 启用备份
      BackupRetentionPeriod: 7
      # 启用删除保护
      DeletionProtection: true
      # 使用专用安全组
      VPCSecurityGroups:
        - !Ref WebSecurityGroup
      # 启用 IAM 数据库认证
      EnableIAMDatabaseAuthentication: true
      # 启用自动小版本升级
      AutoMinorVersionUpgrade: true

  # ============================================================
  # 安全的 EC2 实例
  # ============================================================
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c55b159cbfafe1f0
      # 启用监控
      Monitoring: true
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      # 不在用户数据中存储密钥
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum install -y httpd
          systemctl start httpd
          # 从 SSM Parameter Store 获取配置
          # aws ssm get-parameter --name /app/config --with-decryption
      # 使用 IAM 实例配置文件
      IamInstanceProfile: !Ref WebInstanceProfile
      # 启用根卷加密
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true

  # ============================================================
  # 最小权限的 IAM 策略
  # ============================================================
  AppPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Environment}-app-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub '${AppBucket.Arn}/*'
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/*'

  # ============================================================
  # CloudWatch 日志保留
  # ============================================================
  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Environment}/app'
      RetentionInDays: 30  # 30 天保留期

Outputs:
  DatabaseEndpoint:
    Value: !Ref AppDatabase
    Description: 'Database endpoint'
  # 不输出敏感值
  # DatabasePassword 已通过 NoEcho 隐藏
