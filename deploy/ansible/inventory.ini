# ============================================================
# Ansible inventory with security issues
# ============================================================

[webservers]
web1 ansible_host=192.168.1.10 ansible_user=root ansible_ssh_pass=Password123!
web2 ansible_host=192.168.1.11 ansible_user=root ansible_ssh_pass=Password123!
web3 ansible_host=192.168.1.12 ansible_user=root ansible_ssh_pass=Password123!

[dbservers]
db1 ansible_host=192.168.1.20 ansible_user=root ansible_ssh_pass=DbPass456!
db2 ansible_host=192.168.1.21 ansible_user=root ansible_ssh_pass=DbPass456!

[cacheservers]
redis1 ansible_host=192.168.1.30 ansible_user=root ansible_ssh_pass=RedisPass789!

[monitoring]
monitor1 ansible_host=192.168.1.40 ansible_user=root ansible_ssh_pass=MonitorPass!

[all:vars]
# Issue: All hosts share the same SSH password
# Issue: Using password authentication instead of SSH keys
# Issue: Running as root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'  # Issue: Disabling host key checking

[webservers:vars]
# Issue: Database credentials in inventory
db_host=192.168.1.20
db_user=admin
db_password=Password123!
app_port=5000

[dbservers:vars]
# Issue: Database root password in inventory
mysql_root_password=RootPass123!
mysql_app_password=AppPass456!
