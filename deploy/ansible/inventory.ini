# ============================================================
# 安全的 Ansible Inventory
# ============================================================
# 注意: 此文件不应包含密码
# 使用 ansible-vault 加密敏感信息:
#   ansible-vault encrypt vars/secrets.yml
# 运行时使用:
#   ansible-playbook deploy.yml --ask-vault-pass

[webservers]
web1 ansible_host=192.168.1.10 ansible_user=deploy
web2 ansible_host=192.168.1.11 ansible_user=deploy
web3 ansible_host=192.168.1.12 ansible_user=deploy

[dbservers]
db1 ansible_host=192.168.1.20 ansible_user=deploy
db2 ansible_host=192.168.1.21 ansible_user=deploy

[cacheservers]
redis1 ansible_host=192.168.1.30 ansible_user=deploy

[monitoring]
monitor1 ansible_host=192.168.1.40 ansible_user=deploy

[all:vars]
# 使用 SSH 密钥认证（不使用密码）
ansible_python_interpreter=/usr/bin/python3
# 不禁用主机密钥检查
# ansible_ssh_common_args='-o StrictHostKeyChecking=no'  # 已移除

[webservers:vars]
db_host=192.168.1.20
db_port=5432
app_port=5000
# 数据库凭证从 vault 读取，不在此文件中
