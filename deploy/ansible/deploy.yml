# ============================================================
# 安全的 Ansible Playbook
# ============================================================
---
- name: Deploy application server
  hosts: all
  become: yes
  become_method: sudo

  vars_files:
    # 从外部文件读取敏感信息（不硬编码在 playbook 中）
    - vars/secrets.yml

  vars:
    app_name: security-demo-app
    app_port: 5000
    app_user: appuser
    app_group: appuser
    database_host: "{{ vault_database_host }}"
    database_port: 5432
    database_user: "{{ vault_database_user }}"
    database_password: "{{ vault_database_password }}"
    redis_password: "{{ vault_redis_password }}"
    secret_key: "{{ vault_secret_key }}"

  tasks:
    # ============================================================
    # 系统安全配置
    # ============================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install security packages
      apt:
        name:
          - nginx
          - python3
          - python3-pip
          - python3-venv
          - git
          - curl
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present

    # ============================================================
    # 用户和权限管理
    # ============================================================
    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/false
        system: yes
        create_home: no
        groups: ""  # 不加入 sudo 组

    # ============================================================
    # 应用部署（使用 venv 隔离依赖）
    # ============================================================
    - name: Clone application repository
      git:
        repo: "https://github.com/example/app.git"
        dest: /opt/app
        version: main
        depth: 1  # 浅克隆
      become_user: "{{ app_user }}"

    - name: Create Python virtual environment
      command: python3 -m venv /opt/app/venv
      args:
        creates: /opt/app/venv/bin/activate
      become_user: "{{ app_user }}"

    - name: Install Python dependencies in venv
      pip:
        requirements: /opt/app/requirements.txt
        virtualenv: /opt/app/venv
      become_user: "{{ app_user }}"

    # ============================================================
    # 安全的配置文件管理
    # ============================================================
    - name: Create environment file
      copy:
        content: |
          DATABASE_URL=postgres://{{ database_user }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/app
          REDIS_PASSWORD={{ redis_password }}
          SECRET_KEY={{ secret_key }}
        dest: /opt/app/.env
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'  # 仅所有者可读写

    # ============================================================
    # Nginx 配置
    # ============================================================
    - name: Configure nginx
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/app
        owner: root
        group: root
        mode: '0644'
      notify: Restart nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link
        owner: root
        group: root
      notify: Restart nginx

    # ============================================================
    # 防火墙配置
    # ============================================================
    - name: Configure UFW
      ufw:
        direction: "{{ item.direction }}"
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { direction: incoming, rule: allow, port: '22', proto: tcp }
        - { direction: incoming, rule: allow, port: '80', proto: tcp }
        - { direction: incoming, rule: allow, port: '443', proto: tcp }
        - { direction: incoming, rule: deny, port: any, proto: any }

    - name: Enable UFW
      ufw:
        state: enabled

    # ============================================================
    # Fail2Ban 配置
    # ============================================================
    - name: Configure fail2ban
      template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
      notify: Restart fail2ban

    # ============================================================
    # 服务管理
    # ============================================================
    - name: Start application service
      systemd:
        name: app
        state: started
        enabled: yes
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: Restart fail2ban
      systemd:
        name: fail2ban
        state: restarted
