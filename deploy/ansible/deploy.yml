# ============================================================
# Ansible Playbook with security issues
# ============================================================
---
- name: Deploy application server
  hosts: all
  become: yes  # Issue 1: Running everything as root

  vars:
    # Issue 2: Hardcoded secrets in playbook
    app_name: security-demo-app
    app_port: 5000
    database_host: db.example.com
    database_port: 5432
    database_user: admin
    database_password: "Password123!"
    aws_access_key: "AKIAIOSFODNN7EXAMPLE"
    aws_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    redis_password: "redis_password_123"
    secret_key: "super_secret_key_12345"
    api_token: "ghp_ABCDEFGHIJKLMNOPqrstuvwxyz123456"

  tasks:
    # Issue 3: Insecure apt update
    - name: Update apt cache
      apt:
        update_cache: yes

    # Issue 4: Installing insecure packages
    - name: Install system packages
      apt:
        name:
          - nginx
          - python3
          - python3-pip
          - git
          - curl
          - wget
          - nmap  # Issue 5: Installing security scanning tool on prod
          - netcat  # Issue 6: Installing netcat
          - telnet  # Issue 7: Installing telnet
        state: present

    # Issue 8: Cloning repo without verifying SSH host keys
    - name: Clone application repository
      git:
        repo: "https://github.com/example/app.git"
        dest: /opt/app
        version: main
        # Issue 9: No depth parameter
        # Issue 10: Force yes without verification

    # Issue 11: Writing secrets to files
    - name: Create environment file
      copy:
        content: |
          DATABASE_URL=postgres://{{ database_user }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/app
          AWS_ACCESS_KEY={{ aws_access_key }}
          AWS_SECRET_KEY={{ aws_secret_key }}
          REDIS_PASSWORD={{ redis_password }}
          SECRET_KEY={{ secret_key }}
          API_TOKEN={{ api_token }}
        dest: /opt/app/.env
        owner: root
        group: root
        mode: '0644'  # Issue 12: World-readable secrets

    # Issue 13: Insecure pip install
    - name: Install Python dependencies
      pip:
        requirements: /opt/app/requirements.txt
        # Issue 14: No --break-system-packages or venv

    # Issue 15: Insecure service configuration
    - name: Configure nginx
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/app
      notify: Restart nginx

    # Issue 16: Enabling site without security headers
    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    # Issue 17: Starting service with no firewall
    - name: Start application service
      systemd:
        name: app
        state: started
        enabled: yes

    # Issue 18: No firewall configuration
    - name: Allow all incoming traffic
      ufw:
        rule: allow
        direction: incoming

    # Issue 19: Downloading and executing scripts
    - name: Install monitoring agent
      shell: |
        curl -sSL https://install.example.com/agent.sh | bash
      args:
        creates: /opt/agent/installed

    # Issue 20: Creating admin user with weak password
    - name: Create admin user
      user:
        name: admin
        password: "{{ 'admin123' | password_hash('sha512') }}"
        shell: /bin/bash
        groups: sudo
        append: yes

    # Issue 21: SSH key without restricting permissions
    - name: Deploy SSH key
      authorized_key:
        user: admin
        key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC... admin@company.com"
        state: present

  handlers:
    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
