# ============================================================
# Nginx configuration with security issues
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log debug;  # Issue: Debug logging in production
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Issue: No security headers
    # Missing: X-Frame-Options
    # Missing: X-Content-Type-Options
    # Missing: X-XSS-Protection
    # Missing: Content-Security-Policy
    # Missing: Strict-Transport-Security

    # Issue: Server tokens enabled (version disclosure)
    server_tokens on;

    # Issue: Weak SSL configuration
    ssl_protocols SSLv2 SSLv3 TLSv1 TLSv1.1;  # Issue: Deprecated protocols
    ssl_ciphers HIGH:MEDIUM:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Issue: No rate limiting

    upstream app {
        server 127.0.0.1:5000;
        server 127.0.0.1:5001;
    }

    server {
        listen 80;
        server_name app.example.com;

        # Issue: No HTTPS redirect
        # Issue: No HSTS header

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Issue: Missing X-Forwarded-Proto
        }

        # Issue: Exposing server status
        location /nginx_status {
            stub_status on;
            # Issue: No access restrictions
            allow all;  # Should be restricted to monitoring
        }

        # Issue: Exposing debug endpoints
        location /debug {
            proxy_pass http://127.0.0.1:8000;
            # No authentication
        }

        # Issue: Directory listing
        location /static {
            alias /var/www/static;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # Issue: Information disclosure in error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            # Issue: Custom error pages may leak info
        }
    }

    # Issue: Exposing admin interface
    server {
        listen 8080;
        server_name admin.example.com;

        location / {
            proxy_pass http://127.0.0.1:3000;
            # Issue: No authentication at nginx level
        }

        # Issue: phpMyAdmin exposed
        location /phpmyadmin {
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
