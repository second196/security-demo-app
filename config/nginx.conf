# ============================================================
# 安全的 Nginx 配置
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;  # 不使用 debug 级别
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # 安全头配置
    # ============================================================
    # 隐藏服务器版本信息
    server_tokens off;

    # X-Frame-Options 防止点击劫持
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection (旧浏览器)
    add_header X-XSS-Protection "1; mode=block" always;

    # Content-Security-Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ============================================================
    # SSL/TLS 安全配置
    # ============================================================
    # 仅使用现代 TLS 协议
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # ============================================================
    # 速率限制
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 文件上传大小限制
    client_max_body_size 10M;

    upstream app {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # ============================================================
    # 主服务器 - HTTP 重定向到 HTTPS
    # ============================================================
    server {
        listen 80;
        server_name app.example.com;

        # 重定向所有 HTTP 到 HTTPS
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS 服务器
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name app.example.com;

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # HSTS 头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # 速率限制
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 50;

        # 安全的代理头
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 健康检查端点（无速率限制）
        location /health {
            proxy_pass http://app;
            limit_req off;
            access_log off;
        }

        # 禁用 nginx_status（或限制访问）
        location /nginx_status {
            stub_status on;
            # 仅允许本地访问
            allow 127.0.0.1;
            deny all;
            access_log off;
        }

        # 静态文件 - 禁用目录列表
        location /static {
            alias /var/www/static;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 自定义错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ============================================================
    # 禁用管理界面（如需启用，必须添加认证）
    # ============================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name admin.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # 必须添加认证
    #     auth_basic "Admin Area";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #
    #     location / {
    #         proxy_pass http://127.0.0.1:3000;
    #     }
    # }
}
