# ============================================================
# GitHub Actions - Supply Chain Attack Vector
# ============================================================

name: Dependency Update

on:
  schedule:
    - cron: '0 0 * * *'  # Daily
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2  # Issue: Old version

    # Issue: Using unverified third-party action
    - name: Auto-update dependencies
      uses: random-org/auto-update@main  # Issue: Using main branch, not pinned
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # Issue: Running arbitrary code from PR
    - name: Process dependency PRs
      env:
        # Issue: Exposing additional secrets
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DATABASE_URL: postgres://admin:Password123!@db:5432/app
      run: |
        # Issue: Executing untrusted code
        curl -sSL https://raw.githubusercontent.com/random-org/dep-update/main/update.sh | bash

    # Issue: No verification of downloaded artifacts
    - name: Download and run tool
      run: |
        wget https://tools.example.com/v1/tool-linux-amd64 -O /usr/local/bin/tool
        chmod +x /usr/local/bin/tool
        /usr/local/bin/tool --config .tool-config.yaml

    # Issue: Artifact poisoning potential
    - name: Build and cache
      uses: actions/cache@v2  # Issue: Old version
      with:
        path: |
          ~/.npm
          ~/.cache/pip
        key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    # Issue: Self-hosted runner risk
    # runs-on: self-hosted

    # Issue: No branch protection checks
    - name: Auto-merge
      if: github.event_name == 'pull_request'
      run: |
        # Issue: Auto-merging without review
        gh pr merge ${{ github.event.pull_request.number }} --auto --squash

    # Issue: Uploading coverage without verification
    - name: Upload coverage
      uses: codecov/codecov-action@v1  # Issue: Old version, potential vulnerability
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
