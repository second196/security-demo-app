# ============================================================
# GitHub Actions workflow with security issues
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Issue 1: No environment isolation

    steps:
    # Issue 2: Using unverified third-party action
    - name: Checkout code
      uses: actions/checkout@v2  # Old, potentially vulnerable version
      with:
        fetch-depth: 0

    # Issue 3: Hardcoded secrets in workflow
    - name: Configure AWS credentials
      run: |
        echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v2  # Issue 4: Old action version
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      env:
        # Issue 5: Secrets exposed as env vars without masking
        DATABASE_URL: postgres://admin:Password123@localhost:5432/test
        SECRET_KEY: super_secret_key_12345
        STRIPE_KEY: sk_live_4eC39HqLyjWDarjtT1zdp7dc
      run: |
        pytest tests/

    - name: Build and push Docker image
      # Issue 6: Using docker login with secrets directly
      run: |
        docker build -t myregistry/security-demo:${{ github.sha }} .
        docker login -u admin -p Password123! myregistry.com
        docker push myregistry/security-demo:${{ github.sha }}

    # Issue 7: Pull request target with write permissions
    - name: Deploy to staging
      if: github.event_name == 'pull_request'
      # Issue 8: Deploying on PR events
      run: |
        echo "Deploying PR ${{ github.event.pull_request.number }}"
        curl -X POST https://api.example.com/deploy \
          -H "Authorization: Bearer ghp_ABCDEFGHIJKLMNOPqrstuvwxyz123456" \
          -d '{"env": "staging"}'

    # Issue 9: Using script from PR without verification
    - name: Run PR script
      if: github.event_name == 'pull_request'
      run: |
        # Dangerous: executing code from PR
        gh pr diff ${{ github.event.pull_request.number }} --name-only | \
          grep '\.sh$' | xargs -I {} bash {}

    # Issue 10: Unpinned action version
    - name: Upload coverage
      uses: codecov/codecov-action@v1
      with:
        fail_ci_if_error: false

  release:
    runs-on: ubuntu-latest
    needs: build
    # Issue 11: No environment protection rules
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Create release
      uses: softprops/action-gh-release@v1
      # Issue 12: No tag verification
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Issue 13: Additional hardcoded tokens
        DEPLOY_TOKEN: ghp_ABCDEFGHIJKLMNOPqrstuvwxyz123456

    # Issue 14: Artifact upload without retention policy
    - name: Upload artifacts
      uses: actions/upload-artifact@v2
      with:
        name: release-artifacts
        path: dist/
