{
  "version": "2",
  "rules": [
    {
      "id": "aws-access-key",
      "description": "AWS Access Key",
      "regex": "(?:^|[^A-Za-z0-9/+=])(?:AKIA|ABIA|ACCA|ASIA)[A-Z0-9]{16}(?:[^A-Za-z0-9/+=]|$)",
      "entropy": 2.5,
      "tags": ["key", "AWS"]
    }
  ],
  "allowlist": {
    "paths": [
      "tests/",
      "docs/",
      "config/credentials.json",
      ".env",
      "deploy/terraform/terraform.tfstate",
      "config/backup.env",
      "config/server.pem",
      "config/id_ed25519",
      "config/kubeconfig"
    ],
    "commits": [],
    "regex": [
      "example",
      "EXAMPLE",
      "test",
      "TEST",
      "fake",
      "FAKE"
    ]
  }
}
